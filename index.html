<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Stylemate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one 1120px editorial column. The landing hero pairs a large serif headline with a live sample passport.
   App screens stack cards that collapse to one column on phones. The accent recolours to the user's season. */
:root{
  --bg:#171513; --bg-2:#1F1C19; --surface:#26221F; --surface-2:#312C28; --line:#473F38;
  --fg:#FBF7F1; --fg-2:#E3DDD3; --muted:#B9B1A5;
  --accent:#C0561F; --accent-text:#E2845A; --on-accent:#FFFFFF;
  --display:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:20px; --r-md:16px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#FBF6EE; --bg-2:#F4ECDF; --surface:#FFFFFF; --surface-2:#FAF3E8; --line:#E8DCC9;
    --fg:#1B1A18; --fg-2:#3A3731; --muted:#665F54; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#FBF6EE; --bg-2:#F4ECDF; --surface:#FFFFFF; --surface-2:#FAF3E8; --line:#E8DCC9;
  --fg:#1B1A18; --fg-2:#3A3731; --muted:#665F54; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{
  background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
em{font-style:italic}
.wrap{max-width:1120px;margin-inline:auto;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:10px;border:0;font-weight:600}
.skip:focus{left:16px;z-index:40}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* Header and navigation */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:400 26px/1 var(--display);letter-spacing:-.01em}
.brand em{color:var(--accent-text)}
.nav-wide{display:none;gap:4px}
.nav-wide a{padding:9px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.nav-wide a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg-2);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));justify-content:space-around}
.tabs a{display:grid;justify-items:center;gap:2px;padding:6px 10px;border-radius:12px;text-decoration:none;color:var(--muted);font:500 11px/1.2 var(--body);min-width:58px}
.tabs a[aria-current="page"]{color:var(--accent-text)}
@media (min-width:760px){.nav-wide{display:flex}}
@media (max-width:759px){.tabs{display:flex}body.has-tabs{padding-bottom:88px}}

/* Type */
.display{font:400 clamp(42px,7.4vw,84px)/.96 var(--display);letter-spacing:-.015em;text-wrap:balance}
.display em,.h1 em,.h2 em{color:var(--accent-text)}
.h1{font:400 clamp(34px,5.6vw,56px)/1.03 var(--display);letter-spacing:-.01em;text-wrap:balance}
.h2{font:400 clamp(28px,4.2vw,40px)/1.08 var(--display);text-wrap:balance}
.h3{font:600 17px/1.3 var(--body)}
.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);max-width:60ch}
.lede{font-size:clamp(17px,2vw,19px);max-width:54ch;color:var(--fg-2)}
.fine{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono)}

/* Buttons, chips, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:54px;padding:14px 26px;font-size:16px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.quiet{border-color:transparent;color:var(--muted)}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:600 12px var(--body);color:var(--fg-2)}
.mini:hover{border-color:var(--muted)}
.pill{display:inline-flex;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-l{position:relative;display:inline-flex}
.chip-l input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip-l span,.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:15px}
.chip-l input:checked+span{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.chip-l input:focus-visible+span{outline:2px solid var(--accent-text);outline-offset:2px}
.chips.ro .chip{padding:6px 12px;font-size:13px;color:var(--fg-2)}
input[type=text],input[type=number]{width:100%;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
input::placeholder{color:var(--muted)}
input[type=number]{-moz-appearance:textfield}
.field{display:grid;gap:8px;border:0;padding:0;margin:0;min-width:0}
.field>label,.field>legend{font-weight:600;font-size:14px;color:var(--fg-2);padding:0}
.hrow{display:flex;gap:10px;align-items:center}
.hrow label{font-size:14px;color:var(--muted)}
.hrow input{max-width:120px}
.form{display:grid;gap:22px;max-width:620px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}

/* Cards and grid */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,3vw,26px);display:grid;gap:14px;align-content:start;min-width:0}
.block{display:grid;gap:20px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.grid{grid-template-columns:repeat(12,1fr)}.s7{grid-column:span 7}.s5{grid-column:span 5}.s12{grid-column:span 12}}
main.wrap{display:grid;gap:clamp(28px,5vw,56px);padding-block:12px 64px}
main.app{gap:22px}

/* Landing */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;padding:clamp(22px,5vw,56px);background:var(--bg-2);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 62%),var(--bg-2);
  display:grid;grid-template-columns:1fr;gap:clamp(24px,5vw,56px);align-items:center}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media (min-width:900px){.hero{grid-template-columns:1.05fr .95fr}}
.hero-copy{display:grid;gap:20px;min-width:0}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.fams{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.fam{display:grid;gap:8px;align-content:start}
.fam .chips{gap:6px}
.season-chip{cursor:pointer;padding:8px 14px;font-size:14px}
.season-chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.season-chip[aria-pressed="true"]{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}
.steps{display:grid;gap:16px;counter-reset:s;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.steps li{counter-increment:s;display:grid;gap:8px;align-content:start;padding-top:16px;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);font:400 44px/1 var(--display);color:var(--accent-text)}
.steps p{color:var(--muted)}
.privacy{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.privacy p{color:var(--fg-2);font-size:15px}
.foot{padding-block:8px 48px;display:grid;gap:6px}

/* Passport */
.pp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,3.5vw,28px);display:grid;gap:20px;min-width:0}
.pp-top{display:flex;justify-content:space-between;gap:12px;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pp-id{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pp-id>div{display:grid;gap:4px;min-width:0}
.pp-id b{font-weight:600;overflow-wrap:anywhere}
.pp-label{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pp-name{font:400 clamp(46px,9vw,72px)/.92 var(--display);letter-spacing:-.015em}
.pp-name em{color:var(--accent-text)}
.pp-head{display:grid;gap:12px}
.pp-note{color:var(--fg-2);max-width:46ch}
.pp-sec{display:grid;gap:10px}
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{display:block;aspect-ratio:1/1.1;border-radius:12px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.sw.sm{aspect-ratio:1/1;border-radius:10px}
.cap{font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.neu{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.neu .sw{aspect-ratio:1/.7;border-radius:10px}
.pp-faces{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:520px){.pp-faces{grid-template-columns:1fr}}
.dots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.dots li{display:grid;justify-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.25;color:var(--fg-2);min-width:0}
.dots i{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.3);position:relative;overflow:hidden}
.dots.away i::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 46%,var(--surface) 46%,var(--surface) 54%,transparent 54%)}
.pp-metal{display:flex;gap:14px;align-items:center}
.pp-metal>div{display:grid;gap:2px;min-width:0}
.pp-metal span:last-child{color:var(--fg-2);font-size:14px}
.disc{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.disc.gold{background:linear-gradient(135deg,#F6E3A1,#C99A3D 60%,#8E6A22)}
.disc.silver{background:linear-gradient(135deg,#F2F4F7,#9AA0A8 60%,#6B7078)}
.disc.both{background:linear-gradient(135deg,#F6E3A1 0 50%,#C9CED5 50% 100%)}
.mrz{font:400 11px/1.5 var(--mono);letter-spacing:.08em;color:var(--muted);word-break:break-all;border-top:1px dashed var(--line);padding-top:12px}
.pp-disc{font-size:12px;color:var(--muted)}
.reveal .sw{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 35ms)}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}

/* Wizard */
.wiz{display:grid;gap:26px;max-width:680px;margin-inline:auto;width:100%}
.prog{display:grid;gap:10px}
.prog-top{display:flex;justify-content:space-between;gap:12px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opts{display:grid;gap:10px}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt .o{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;min-height:62px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.opt .o small{color:var(--muted);font-size:13px;text-align:right}
.opt input:checked+.o{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.opt input:focus-visible+.o{outline:2px solid var(--accent-text);outline-offset:2px}
.depths{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.depths .o{flex-direction:column;justify-content:center;padding:14px 4px;gap:8px;text-align:center;font-size:14px;font-weight:500}
.depths i{width:44px;height:44px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.ticks{display:grid;gap:8px}
.ticks li{display:flex;gap:10px;color:var(--fg-2);font-size:15px}
.ticks li::before{content:"";flex:none;width:7px;height:7px;margin-top:9px;border-radius:50%;background:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.thumb{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.thumb img{width:96px;height:128px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.file{position:relative}
.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.file input:disabled{cursor:not-allowed}
.file:has(input:focus-visible){outline:2px solid var(--accent-text);outline-offset:3px}
.opt-tag{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);vertical-align:middle;margin-left:6px}

/* Colours screen */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);justify-self:start}
.seg button{border:0;background:transparent;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.pal{display:grid;gap:0}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.psw{width:44px;height:44px;border-radius:12px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.pt{display:grid;min-width:0}
.pt b{font-weight:600}
.pt code{font:400 13px var(--mono);color:var(--muted);user-select:all}
.palgrid{display:grid;gap:16px}
@media (min-width:900px){.palgrid{grid-template-columns:1fr 1fr}.palgrid .wide{grid-column:span 2}}
.why{display:grid;gap:8px}
.why li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;color:var(--fg-2)}
.why li span:last-child{color:var(--muted);text-align:right}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* Home */
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.flat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{aspect-ratio:1/.72;border:1.5px dashed var(--line);border-radius:14px;display:grid;place-items:center;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats>div{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{font:400 36px/1 var(--display)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.shelf .slot{aspect-ratio:1/1}
.qa{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.qa .btn{justify-content:space-between;width:100%}
.danger-zone{display:grid;gap:12px}
.btn.warn{border-color:#C4553F;color:#E0735C}

/* Body shape */
.choose{display:grid;gap:16px}
@media (min-width:760px){.choose{grid-template-columns:1fr 1fr}}
.choice{display:grid;gap:10px;align-content:start;justify-items:start;text-align:left;width:100%;padding:clamp(18px,3vw,26px);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.choice:hover{border-color:var(--muted)}
.choice b{font:400 30px/1.1 var(--display)}
.choice .d{color:var(--muted);font-size:15px}
.mform{display:grid;gap:20px;max-width:640px}
.mgrid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:560px){.mgrid{grid-template-columns:1fr 1fr}}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--fg);font-weight:600;border-left:3px solid #D2573F;padding:6px 0 6px 12px}
.qpanel{display:grid;gap:18px;max-width:640px}
.shape-head{display:grid;gap:22px;align-items:center}
@media (min-width:760px){.shape-head{grid-template-columns:220px 1fr;gap:36px}}
.fig{width:100%;max-width:220px;height:auto;color:var(--fg);justify-self:center}
.fig .body{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.fig .guide{stroke:var(--accent-text);stroke-width:1;stroke-dasharray:3 3}
.fig text{font:500 9px var(--mono);fill:var(--muted);letter-spacing:.08em}
.shape-copy{display:grid;gap:14px;min-width:0}
.ratio{display:flex;gap:8px;flex-wrap:wrap}
.ratio .chip{font-family:var(--mono);font-size:13px;padding:6px 12px}
.conf{display:grid;gap:6px;max-width:380px}
.wgrid{display:grid;gap:16px}
@media (min-width:760px){.wgrid{grid-template-columns:1fr 1fr}}
.wcard{display:grid;grid-template-columns:64px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,3vw,22px);min-width:0;align-content:start}
.gicon{width:64px;height:80px;color:var(--accent-text);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wbody{display:grid;gap:10px;min-width:0}
.against{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px;font-size:14px;color:var(--fg-2)}
.fit{display:grid}
.fit>div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
@media (max-width:520px){.fit>div{grid-template-columns:1fr;gap:2px}}
.fit dt{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.fit dd{color:var(--fg-2)}

/* Wardrobe */
.file input{height:100%}
select{font:400 15px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;width:100%}
input[type=date]{width:100%;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
input[type=color]{width:56px;height:46px;padding:3px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.sel{display:grid;gap:4px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0}
.fbar{display:grid;gap:12px}
.catrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.catrow .chip{flex:none;cursor:pointer;padding:8px 14px;font-size:14px}
.catrow .chip[aria-pressed="true"]{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.selrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.selrow{grid-template-columns:repeat(6,minmax(0,1fr))}}
.wtools{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.wtools .check{font-size:14px}
.igrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:620px){.igrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.igrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.icard{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;min-width:0;align-content:start;width:100%}
.icard:hover{border-color:var(--muted)}
.art{background:#F3EDE2;border-radius:12px;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;position:relative;color:#1B1A18}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art svg{width:62%;height:auto;max-height:90%}
.art .fav{position:absolute;top:6px;right:8px;font-size:16px;color:#B5502A}
.art.big{max-width:320px;width:100%;justify-self:center}
.im{display:grid;gap:2px;min-width:0}
.im b{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.im span{font-size:13px;color:var(--muted);line-height:1.35}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.4);margin-right:6px;vertical-align:middle}
.mini-card{display:grid;gap:6px;text-align:left;min-width:0;background:transparent;border:0;padding:0;font-size:13px;color:var(--fg-2)}
.mini-card .art{aspect-ratio:1/1}
.mini-card span{overflow-wrap:anywhere;line-height:1.3}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60}
.sheet{position:fixed;z-index:61;inset:0;background:var(--bg);overflow:auto;overscroll-behavior:contain;display:grid;gap:18px;align-content:start;grid-auto-rows:max-content;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet{inset:4vh auto 4vh 50%;transform:translateX(-50%);width:min(700px,92vw);border-radius:24px;border:1px solid var(--line);padding-inline:28px}}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px}
.frame{border:2px dashed var(--line);border-radius:var(--r-lg);aspect-ratio:16/9;max-height:220px;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.fgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:560px){.fgrid{grid-template-columns:1fr 1fr}}
.colrow{display:flex;gap:12px;align-items:center}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.tags>div{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.tags dt{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tags dd{font-size:15px;overflow-wrap:anywhere}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat3>div{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.stat3 dt{font-size:12px;color:var(--muted)}
.stat3 dd{font:400 26px/1.1 var(--display)}
.stat3 dd small{font:400 13px var(--body);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--fg);justify-self:start}
body.noscroll{overflow:hidden}

/* Outfits */
.oflat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.otile{display:grid;gap:4px;min-width:0;position:relative}
.otile .art{aspect-ratio:4/5;border-radius:12px;padding:8px}
.otile .art svg,.otile .art img{width:100%;height:100%;object-fit:contain}
.olab{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oname{font-size:12px;color:var(--fg-2);line-height:1.3;overflow-wrap:anywhere}
.otb{display:flex;gap:4px;flex-wrap:wrap}
.ogrid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.ogrid{grid-template-columns:1fr 1fr}}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,3vw,22px);display:grid;gap:14px;align-content:start;min-width:0}
.ohead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hbadge{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--fg-2)}
.hbadge.on{border-color:var(--accent-text);color:var(--accent-text)}
.hbadge.clash{border-color:#C4553F;color:#E0735C}
.orate{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.orate .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.mini[aria-pressed="true"]{border-color:var(--accent-text);color:var(--accent-text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.mini{min-height:32px}
.seg:has(button[data-act="o-tab"]){flex-wrap:wrap;border-radius:22px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font:500 10px var(--mono);letter-spacing:.08em;text-align:center;color:var(--muted);padding:4px 0}
.cday{min-height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font-size:14px;position:relative}
.cday[aria-pressed="true"]{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}
.cday.today{font-weight:700}
.cday.has::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.cday.pad{border:0;pointer-events:none}
.lockbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.oin{display:grid;gap:12px}
.oin input[type=date]{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:6px 10px;font:inherit}
/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;max-width:min(92vw,420px);text-align:center;z-index:50;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:759px){#toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function skinHint(px, W, H){

}

function readPhoto(file){
  return new Promise(resolve => {
    let url; try { url = URL.createObjectURL(file); } catch (e) { resolve(null); return; }
    const im = new Image();
    im.onload = () => {
      try {
        const max = 480, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        const sm = document.createElement('canvas'); sm.width = 48; sm.height = 48;
        const sx = sm.getContext('2d'); sx.drawImage(im, 0, 0, 48, 48);
        resolve({ img:c.toDataURL('image/jpeg', 0.72), col:sampleColours(sx.getImageData(0, 0, 48, 48).data, 48, 48) });
      } catch (e) { resolve(null); }
      URL.revokeObjectURL(url);
    };
    im.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    im.src = url;
  });
}

function logWear(ent, date){
  if (S.wlog.some(w => w.key === ent.key && w.date === date)){ toast('Already logged for that day'); return false; }

  if (!ids.length){ toast('Those pieces are no longer in your wardrobe'); return false; }
  ids.forEach(id => { const it = findItem(id); it.wears += 1; if (!it.last || it.last < date) it.last = date; });
  S.wlog.push({ id:'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), date:date, key:ent.key, ids:ids });
  if (ent.wornOn){ ent.wornOn.push(date); }

function unlogWear(wid){
  const w = S.wlog.find(x => x.id === wid); if (!w) return;
  S.wlog = S.wlog.filter(x => x.id !== wid);
  (w.ids || w.key.split('|')).forEach(id => {
    const it = findItem(id); if (!it) return;
    it.wears = Math.max(0, it.wears - 1);
    const dates = S.wlog.filter(x => (x.ids || x.key.split('|')).indexOf(id) >= 0).map(x => x.date).sort();
    it.last = dates.length ? dates[dates.length - 1] : (it.wears > 0 ? it.last : '');
  });
  S.outfits.forEach(o => { if (o.key === w.key){ const k = o.wornOn.indexOf(w.date); if (k >= 0) o.wornOn.splice(k, 1); } });
  saveW(); saveO();
}

function runPhotoHint(){

    }
    case 'o-rate': {
      const out = S.ob.list[+t.dataset.i], v = t.dataset.v;
      if (S.ratings[out.key] === v) delete S.ratings[out.key]; else S.ratings[out.key] = v;
      saveO();
      if (v === 'no' && S.ratings[out.key] === 'no'){ genNow('Noted. That combination will not come back.'); } else { render(); toast(S.ratings[out.key] ? 'Noted. Future outfits lean this way.' : 'Rating removed'); }
      break;
    }
    case 'o-save': { const out = S.ob.list[+t.dataset.i]; saveOutfit(out); saveO(); render(); toast('Saved to Outfits'); break; }
    case 'o-wore': { const out = S.ob.list[+t.dataset.i], ent = saveOutfit(out); if (logWear(ent, todayISO())){ S.ob.seed = S.ob.seed; runGen(); render(); toast('Logged for today'); } else render(); break; }
    case 'o-more': { const out = S.ob.list[+t.dataset.i], it = out.parts.dress || out.parts.top; S.ob.locks = [it.id]; S.ob.seed = null; genNow('Showing outfits built around ' + it.name); break; }
    case 'o-tab': S.otab = t.dataset.v; S.focusId = null; render(); break;
    case 'cal-prev': { const c = S.cal; c.m--; if (c.m < 0){ c.m = 11; c.y--; } render(); break; }
    case 'cal-next': { const c = S.cal; c.m++; if (c.m > 11){ c.m = 0; c.y++; } render(); break; }
    case 'cal-day': S.cal.sel = S.cal.sel === t.dataset.d ? null : t.dataset.d; render(); break;
    case 'so-log': { const ent = S.outfits.find(x => x.id === t.dataset.id), inp = document.getElementById('lw-' + t.dataset.id), d = inp && inp.value; if (ent && /^\d{4}-\d{2}-\d{2}$/.test(d || '')){ if (d > todayISO()){ toast('Pick today or an earlier day'); break; } if (logWear(ent, d)){ S.cal.sel = d; const [y, m] = d.split('-'); S.cal.y = +y; S.cal.m = +m - 1; render(); toast('Logged'); } } else toast('Pick a date first'); break; }
    case 'so-unlog': unlogWear(t.dataset.id); render(); toast('Log removed'); break;
    case 'so-del': S.outfits = S.outfits.filter(x => x.id !== t.dataset.id); saveO(); render(); toast('Outfit deleted. Your wear log is unchanged.'); break;
    case 'del-garment-photos': S.items.forEach(i => { i.img = null; }); saveW(); render(); toast('Garment photos deleted'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'add-files' || t.id === 'add-cam'){ const fl = t.files; addFiles(fl).then(() => { try { t.value = ''; } catch (er) {} }); return; }
  if (t.id === 'it-sub'){ readItemForm(); applySubDefaults(S.sheet.draft); S.focusId = 'it-sub'; render(); return; }
  if (t.id === 'cap-a1' || t.id === 'cap-a2' || t.id === 'cap-size' || t.id === 'cap-weather'){ S.cap[t.id.slice(4) === 'a1' ? 'a1' : t.id.slice(4) === 'a2' ? 'a2' : t.id.slice(4)] = t.value; S.cap.res = null; S.focusId = t.id; render(); return; }
  if (t.id === 'st-item'){ S.story.id = t.value; S.focusId = t.id; render(); return; }
  if (t.id === 'tr-days' || t.id === 'tr-weather'){ S.trip[t.id.slice(3)] = t.id === 'tr-days' ? +t.value : t.value; S.trip.res = null; saveO(); S.focusId = t.id; render(); return; }
  if (t.id && t.id.indexOf('tr-chk-') === 0){ const id = t.id.slice(7); if (t.checked) S.trip.checked[id] = 1; else delete S.trip.checked[id]; saveO(); return; }
  if (t.id === 'shop-on'){ S.shopOn = t.checked; try { localStorage.setItem(SHOPKEY, S.shopOn ? '1' : '0'); } catch (er) {} if (!S.shopOn && S.otab === 'shop') S.otab = 'build'; S.focusId = t.id; render(); toast(S.shopOn ? 'Shop smart is on. Find it in Outfits.' : 'Shop smart is off'); return; }
  if (t.id === 'ob-weather'){ S.ob.weather = t.value; S.ob.locks = []; S.ob.seed = null; runGen(); saveO(); S.focusId = t.id; render(); return; }
  if (t.id && t.id.indexOf('wf-') === 0){
    const k = t.id.slice(3);
    if (k === 'demo'){ setDemo(t.checked); S.focusId = t.id; render(); toast(t.checked ? 'Demo wardrobe added. Remove it any time.' : 'Demo pieces removed. Your own pieces stay.'); return; }
    if (k === 'cur'){ S.currency = t.value; saveW(); S.focusId = t.id; render(); return; }
    S.wf[k] = k === 'fav' ? t.checked : t.value; S.focusId = t.id; render(); return;
  }
  if (t.name === 'units'){ const prev = S.profile.units; readBasics(); readMeasureDraft(); S.profile.units = t.value; convertDraft(prev, t.value); S.focusId = 'u-' + t.value; render(); return; }
  if (t.name === 'sq'){ S.sAns[SQ[S.sq].id] = t.value; const b = document.getElementById('sq-primary'); if (b) b.disabled = false; return; }
  if (t.id === 'c-skirts'){ S.skirts = t.checked; S.focusId = 'c-skirts'; render(); return; }
  if (t.name === 'intent'){ S.profile.intents = Array.from(document.querySelectorAll('input[name=intent]:checked')).map(i => i.value); save(); return; }
  if (t.id === 'c-body' || t.id === 'c-face'){ S.consent[t.id === 'c-body' ? 'body' : 'face'] = t.checked; S.focusId = t.id; render(); return; }
  if (t.id === 'p-body' || t.id === 'p-face'){
    const k = t.id === 'p-body' ? 'body' : 'face', f = t.files && t.files[0];
    if (f){ if (S.photos[k]) try { URL.revokeObjectURL(S.photos[k]); } catch (er) {} S.photos[k] = URL.createObjectURL(f); S.focusHeading = true; render(); toast('Photo added'); }
    return;
  }
  if (t.name === 'q'){
    S.answers[QUESTIONS[S.q].id] = t.value; save();
    const b = document.getElementById('wiz-primary'); if (b) b.disabled = false;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'tr-dest'){ S.trip.dest = e.target.value.slice(0, 60); saveO(); return; }
  if (e.target.id === 'it-col'){
    const n = $('#it-colname'), card = $('.sheet .art');
    if (n) n.textContent = nameColour(e.target.value.toUpperCase()).name;
    if (card && S.sheet && S.sheet.type === 'edit'){ readItemForm(); card.innerHTML = artHTML(S.sheet.draft, 'e'); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'f-basics'){ readBasics(); save(); S.step = 2; S.focusHeading = true; S.scrollTop = true; render(); }
  else if (f.id === 'f-profile'){ readBasics(); save(); toast('Saved'); }
  else if (f.id === 'f-measure'){ submitMeasure(); }
  else if (f.id === 'f-item'){ submitItem(!!(e.submitter && e.submitter.dataset.all === '1')); }
});
document.addEventListener('keydown', e => {
  if (S.sheet){
    if (e.key === 'Escape'){ closeSheet(); return; }
    if (e.key === 'Tab'){
      const box = $('.sheet'), f = box ? Array.from(box.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')).filter(x => !x.disabled && x.offsetParent !== null) : [];
      if (f.length){
        const a = f[0], z = f[f.length - 1], cur = document.activeElement;
        if (e.shiftKey && (cur === a || cur === $('#sheet-h'))){ e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && cur === z){ e.preventDefault(); a.focus(); }
      }
    }
  }
  const t = e.target.closest && e.target.closest('[role=tab]');
  if (!t || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const order = ['passport', 'palette', 'body'], i = order.indexOf(t.dataset.tab);
  S.tab = order[(i + (e.key === 'ArrowRight' ? 1 : order.length - 1)) % order.length]; S.focusId = 'tab-' + S.tab; render();
});

render();
})();
</script>

</body>
